<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#064e3b" />
  <title>LIFE SPIKE | 접속</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="login">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <p class="login-kicker">LIFE SPIKE</p>
      <h1 id="login-title">생활 루틴을 확인하려면<br />Google로 로그인하세요</h1>
      <p class="login-copy">허가받은 사람만 이 페이지에 접속할 수 있습니다.</p>

      <div class="password-form">
        <button id="google-login" class="google-login" type="button">
          <span class="google-mark" aria-hidden="true">G</span>
          Google로 로그인
        </button>
        <p id="login-message" class="login-message" role="alert" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
